name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate-yaml:
    name: Validate YAML
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse every YAML file
        run: |
          find . \( -name "*.yml" -o -name "*.yaml" \) \
            -not -path "./node_modules/*" -not -path "./.git/*" -print0 |
            xargs -0 -n1 python -c "import yaml,sys; yaml.safe_load(open(sys.argv[1])); print('OK', sys.argv[1])"

  detect:
    name: Detect stack
    runs-on: ubuntu-latest
    outputs:
      stack: ${{ steps.detect.outputs.stack }}
    steps:
      - uses: actions/checkout@v4
      - id: detect
        run: |
          if [ -f package.json ]; then
            echo "stack=node" >> "$GITHUB_OUTPUT"
          elif [ -f requirements.txt ] || [ -f pyproject.toml ]; then
            echo "stack=python" >> "$GITHUB_OUTPUT"
          else
            echo "stack=none" >> "$GITHUB_OUTPUT"
          fi

  node:
    name: Node CI
    needs: detect
    if: needs.detect.outputs.stack == 'node'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test --if-present
      - run: npm run lint --if-present

  python:
    name: Python CI
    needs: detect
    if: needs.detect.outputs.stack == 'python'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f pyproject.toml ]; then pip install .; fi
      - run: |
          if [ -d tests ]; then
            pip install pytest
            pytest -q
          fi
