<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pixelated Catworks</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, -apple-system, sans-serif;
      background: #0f0f13;
      color: #e8e8ec;
      display: grid;
      place-items: center;
    }
    .card {
      max-width: 420px;
      width: 90%;
      background: #17171c;
      border: 1px solid #2a2a33;
      border-radius: 14px;
      padding: 28px;
      text-align: center;
    }
    h1 { margin: 0 0 4px; font-size: 26px; }
    .sub { color: #9a9aa5; margin: 0 0 20px; }
    .cat { font-size: 48px; margin: 8px 0 16px; }
    button {
      width: 100%;
      padding: 12px;
      font-size: 16px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      background: #6d2bf0;
      color: #fff;
      margin-top: 8px;
    }
    button:hover { background: #7d3bfa; }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
    .status {
      margin-top: 16px;
      font-size: 14px;
      word-break: break-word;
      min-height: 20px;
      color: #9a9aa5;
    }
    .status.ok { color: #62e6a0; }
    .status.err { color: #ff7b7b; }
    .info { font-size: 12px; color: #6f6f7a; margin-top: 16px; line-height: 1.6; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Pixelated Catworks</h1>
    <p class="sub">Pixel Cats on Robinhood Chain mainnet</p>
    <div class="cat">🐱</div>
    <p id="supply">Supply: -- / 98</p>
    <p id="price" class="info">Price: --</p>
    <button id="connectBtn">Connect Wallet</button>
    <button id="publicMintBtn" disabled>Buy a Pixel Cat</button>
    <p id="status" class="status"></p>
    <p class="info">
      Network: Robinhood Chain Mainnet (Chain ID 4663)<br>
      RPC: rpc.mainnet.chain.robinhood.com
    </p>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/ethers@6.13.4/dist/ethers.umd.min.js"></script>
  <script>
    const CONTRACT_ADDRESS = "0x001d50Fc09F34691C1EE71FF8ED411a81d2d70ba";
    // Must match the deployed contract ABI
    const CONTRACT_ABI = [
      "function mint(address to) public returns (uint256)",
      "function paidMint() public payable returns (uint256)",
      "function publicMintedOf(address) public view returns (uint256)",
      "function MAX_SUPPLY() public view returns (uint256)",
      "function totalSupply() public view returns (uint256)",
      "function owner() public view returns (address)",
      "function price() public view returns (uint256)",
      "function paused() public view returns (bool)",
      "function setPrice(uint256) public",
      "function setPaused(bool) public",
      "function withdraw() public"
    ];

    const MAINNET = {
      chainId: 4663,
      chainIdHex: "0x1237",
      chainName: "Robinhood Chain Mainnet",
      rpcUrls: ["https://rpc.mainnet.chain.robinhood.com"],
      nativeCurrency: { name: "Ethereum", symbol: "ETH", decimals: 18 },
      blockExplorerUrls: ["https://explorer.mainnet.chain.robinhood.com"]
    };

    const statusEl = document.getElementById("status");
    const connectBtn = document.getElementById("connectBtn");
    const publicMintBtn = document.getElementById("publicMintBtn");
    const supplyEl = document.getElementById("supply");
    const priceEl = document.getElementById("price");

    let signer = null;
    let contract = null;

    function setStatus(msg, type) {
      statusEl.textContent = msg;
      statusEl.className = "status" + (type ? " " + type : "");
    }

    async function switchToMainnet() {
      if (!window.ethereum) throw new Error("No wallet detected (MetaMask or Robinhood Wallet required)");
      try {
        await window.ethereum.request({ method: "wallet_switchEthereumChain", params: [{ chainId: MAINNET.chainIdHex }] });
      } catch (err) {
        if (err.code === 4902) {
          await window.ethereum.request({ method: "wallet_addEthereumChain", params: [MAINNET] });
        } else {
          throw err;
        }
      }
    }

    connectBtn.addEventListener("click", async () => {
      try {
        await switchToMainnet();
        const provider = new ethers.BrowserProvider(window.ethereum);
        signer = await provider.getSigner();
        contract = new ethers.Contract(CONTRACT_ADDRESS, CONTRACT_ABI, signer);

        const network = await provider.getNetwork();
        if (Number(network.chainId) !== MAINNET.chainId) {
          throw new Error("Please switch to Robinhood Chain Mainnet");
        }

        const address = await signer.getAddress();
        setStatus("Connected: " + address.slice(0, 6) + "..." + address.slice(-4), "ok");
        connectBtn.disabled = true;
        publicMintBtn.disabled = false;

        const supply = await contract.totalSupply();
        supplyEl.textContent = "Minted: " + supply.toString() + " / 98";
        const p = await contract.price();
        priceEl.textContent = "Price: " + ethers.formatEther(p) + " ETH";
        const isPaused = await contract.paused();
        if (isPaused) publicMintBtn.disabled = true;
      } catch (err) {
        setStatus(err.message || String(err), "err");
      }
    });

    publicMintBtn.addEventListener("click", async () => {
      if (!signer || !contract) return;
      setStatus("Preparing purchase…");
      publicMintBtn.disabled = true;
      try {
        const from = await signer.getAddress();
        const priceWei = await contract.price();
        const data = contract.interface.encodeFunctionData("paidMint", []);

        // Use our own RPC provider for gas estimate + fee data (bypasses wallet fee pipeline).
        const rp = new ethers.JsonRpcProvider(RPC, 4663);
        const gasLimit = await rp.estimateGas({ from, to: CONTRACT_ADDRESS, data, value: priceWei });

        // maxFeePerGas = 2x the highest recent base fee, tip 1 gwei, never below spot gas price.
        const [history, gpRaw] = await Promise.all([
          rp.send("eth_feeHistory", ["0x8", "latest", []]),
          rp.send("eth_gasPrice", [])
        ]);
        let maxBase = 0n;
        for (const v of history.baseFeePerGas) { const b = BigInt(v); if (b > maxBase) maxBase = b; }
        const spot = BigInt(gpRaw);
        const tip = BigInt("1000000000");
        let maxFee = maxBase * 2n;
        if (maxFee < spot) maxFee = spot;
        if (maxFee < maxBase + tip) maxFee = maxBase + tip;

        setStatus("Please confirm the transaction in your wallet");
        const hex = (b) => "0x" + b.toString(16);
        // eth_sendTransaction returns just the tx hash (no TransactionResponse construction).
        const hash = await window.ethereum.request({
          method: "eth_sendTransaction",
          params: [{
            from,
            to: CONTRACT_ADDRESS,
            data,
            value: hex(priceWei),
            gas: hex(gasLimit),
            maxFeePerGas: hex(maxFee),
            maxPriorityFeePerGas: hex(tip)
          }]
        });
        setStatus("Tx sent: " + hash.slice(0, 10) + "… (pending)");

        // Poll the receipt via raw JSON-RPC (never parse a pending tx object).
        let receipt = null;
        const deadline = Date.now() + 90000;
        while (!receipt && Date.now() < deadline) {
          receipt = await rp.send("eth_getTransactionReceipt", [hash]);
          if (!receipt) await new Promise((r) => setTimeout(r, 1000));
        }
        if (!receipt) throw new Error("Timed out waiting for confirmation");
        if (receipt.status !== "0x1") throw new Error("Transaction reverted on-chain");

        const mine = await contract.publicMintedOf(from);
        setStatus("Purchased a Pixel Cat! You have " + mine + "/3. Tx: " + hash, "ok");
        if (Number(mine) >= 3) publicMintBtn.disabled = true;
        const supply = await contract.totalSupply();
        supplyEl.textContent = "Minted: " + supply.toString() + " / 98";
      } catch (err) {
        setStatus((err.shortMessage || err.message || String(err)).split("\n")[0], "err");
        publicMintBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
