<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pixelated Catworks</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, -apple-system, sans-serif;
      background: #0f0f13;
      color: #e8e8ec;
      display: grid;
      place-items: center;
    }
    .card {
      max-width: 420px;
      width: 90%;
      background: #17171c;
      border: 1px solid #2a2a33;
      border-radius: 14px;
      padding: 28px;
      text-align: center;
    }
    h1 { margin: 0 0 4px; font-size: 26px; }
    .sub { color: #9a9aa5; margin: 0 0 20px; }
    .cat { font-size: 48px; margin: 8px 0 16px; }
    button {
      width: 100%;
      padding: 12px;
      font-size: 16px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      background: #6d2bf0;
      color: #fff;
      margin-top: 8px;
    }
    button:hover { background: #7d3bfa; }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
    .status {
      margin-top: 16px;
      font-size: 14px;
      word-break: break-word;
      min-height: 20px;
      color: #9a9aa5;
    }
    .status.ok { color: #62e6a0; }
    .status.err { color: #ff7b7b; }
    .info { font-size: 12px; color: #6f6f7a; margin-top: 16px; line-height: 1.6; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Pixelated Catworks</h1>
    <p class="sub">Pixel Cats on Robinhood Chain testnet</p>
    <div class="cat">🐱</div>
    <p id="supply">Supply: -- / 98</p>
    <button id="connectBtn">Connect Wallet</button>
    <button id="publicMintBtn" disabled>Claim a Free Pixel Cat</button>
    <button id="mintBtn" disabled>Owner Mint</button>
    <p id="status" class="status"></p>
    <p class="info">
      Network: Robinhood Chain Testnet (Chain ID 46630)<br>
      RPC: rpc.testnet.chain.robinhood.com
    </p>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/ethers@6.13.4/dist/ethers.umd.min.js"></script>
  <script>
    const CONTRACT_ADDRESS = "0x421a4F078bC470bA1B05b0e59caa5b087DCbb880";
    // Must match the deployed contract ABI
    const CONTRACT_ABI = [
      "function mint(address to) public returns (uint256)",
      "function publicMint() public returns (uint256)",
      "function publicMintedOf(address) public view returns (uint256)",
      "function MAX_SUPPLY() public view returns (uint256)",
      "function totalSupply() public view returns (uint256)",
      "function owner() public view returns (address)"
    ];

    const TESTNET = {
      chainId: 46630,
      chainIdHex: "0xB626",
      chainName: "Robinhood Chain Testnet",
      rpcUrls: ["https://rpc.testnet.chain.robinhood.com"],
      nativeCurrency: { name: "Test ETH", symbol: "ETH", decimals: 18 },
      blockExplorerUrls: ["https://explorer.testnet.chain.robinhood.com"]
    };

    const statusEl = document.getElementById("status");
    const connectBtn = document.getElementById("connectBtn");
    const publicMintBtn = document.getElementById("publicMintBtn");
    const mintBtn = document.getElementById("mintBtn");
    const supplyEl = document.getElementById("supply");

    let signer = null;
    let contract = null;

    function setStatus(msg, type) {
      statusEl.textContent = msg;
      statusEl.className = "status" + (type ? " " + type : "");
    }

    async function switchToTestnet() {
      if (!window.ethereum) throw new Error("No wallet detected (MetaMask or Robinhood Wallet required)");
      try {
        await window.ethereum.request({ method: "wallet_switchEthereumChain", params: [{ chainId: TESTNET.chainIdHex }] });
      } catch (err) {
        if (err.code === 4902) {
          await window.ethereum.request({ method: "wallet_addEthereumChain", params: [TESTNET] });
        } else {
          throw err;
        }
      }
    }

    connectBtn.addEventListener("click", async () => {
      try {
        await switchToTestnet();
        const provider = new ethers.BrowserProvider(window.ethereum);
        signer = await provider.getSigner();
        contract = new ethers.Contract(CONTRACT_ADDRESS, CONTRACT_ABI, signer);

        const network = await provider.getNetwork();
        if (Number(network.chainId) !== TESTNET.chainId) {
          throw new Error("Please switch to Robinhood Chain Testnet");
        }

        const address = await signer.getAddress();
        setStatus("Connected: " + address.slice(0, 6) + "..." + address.slice(-4), "ok");
        connectBtn.disabled = true;
        publicMintBtn.disabled = false;
        const owner = await contract.owner();
        mintBtn.disabled = (owner.toLowerCase() !== address.toLowerCase());

        const supply = await contract.totalSupply();
        supplyEl.textContent = "Minted: " + supply.toString() + " / 98";
      } catch (err) {
        setStatus(err.message || String(err), "err");
      }
    });

    publicMintBtn.addEventListener("click", async () => {
      if (!signer || !contract) return;
      setStatus("Claiming… please confirm in your wallet");
      publicMintBtn.disabled = true;
      try {
        const tx = await contract.publicMint();
        setStatus("Tx sent: " + tx.hash.slice(0, 10) + "… (waiting for confirmation)");
        const receipt = await tx.wait();
        const address = await signer.getAddress();
        const mine = await contract.publicMintedOf(address);
        setStatus("Claimed a Pixel Cat! You have " + mine + "/3. Tx: " + receipt.hash, "ok");
        if (Number(mine) >= 3) publicMintBtn.disabled = true;
        const supply = await contract.totalSupply();
        supplyEl.textContent = "Minted: " + supply.toString() + " / 98";
      } catch (err) {
        setStatus(err.message || String(err), "err");
        publicMintBtn.disabled = false;
      }
    });

    mintBtn.addEventListener("click", async () => {
      if (!signer || !contract) return;
      setStatus("Minting… please confirm in your wallet");
      mintBtn.disabled = true;
      try {
        const address = await signer.getAddress();
        const tx = await contract.mint(address);
        setStatus("Tx sent: " + tx.hash.slice(0, 10) + "… (waiting for confirmation)");
        const receipt = await tx.wait();
        setStatus("Minted! Token in your wallet. Tx: " + receipt.transactionHash, "ok");
        const supply = await contract.totalSupply();
        supplyEl.textContent = "Minted: " + supply.toString() + " / 98";
      } catch (err) {
        setStatus(err.message || String(err), "err");
      } finally {
        mintBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
