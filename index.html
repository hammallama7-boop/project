<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pixelated Catworks — Metadata</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, -apple-system, sans-serif;
      background: #0f0f13;
      color: #e8e8ec;
      display: grid;
      place-items: center;
      padding: 24px;
    }
    main { max-width: 640px; text-align: center; }
    h1 { font-size: 30px; margin: 0 0 8px; }
    p { color: #9a9aa5; line-height: 1.6; }
    a { color: #8b6bf0; }
    .cat { font-size: 56px; margin: 8px 0 12px; }
    .meta {
      margin-top: 20px;
      font-size: 13px;
      color: #6f6f7a;
      word-break: break-word;
      background: #17171c;
      border: 1px solid #2a2a33;
      border-radius: 10px;
      padding: 14px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    }
  </style>
</head>
<body>
  <main>
    <div class="cat">🐱</div>
    <h1>Pixelated Catworks</h1>
    <p>A curated collection of 777 pixel-art cats on Robinhood Chain.</p>
    <p>
      <a href="frontend/">Open the mint frontend</a>
    </p>
    <div class="meta">
      Metadata is served from this site for token on-chain URIs, e.g.<br>
      <a href="metadata/generated/1.json">/metadata/generated/1.json</a>
    </div>
  </main>
</body>
</html>
