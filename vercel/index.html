<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Magic Internet Artworks — Mint on Base</title>
  <meta property="og:title" content="Magic Internet Artworks — Mint on Base">
  <meta property="og:description" content="98 procedural pixel artworks. Mint one on Base via the Farcaster wallet.">
  <meta property="og:image" content="https://hammallama7-boop.github.io/project/magic-internet-artworks/frame/frame-banner.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">

  <!-- Farcaster Frame vNext — tx endpoint will be https://<your-app>.vercel.app/api/tx -->
  <meta property="fc:frame" content="vNext">
  <meta property="fc:frame:post_url" content="/api/tx">
  <meta property="fc:frame:image" content="https://hammallama7-boop.github.io/project/magic-internet-artworks/frame/frame-banner.png">
  <meta property="fc:frame:image:aspect_ratio" content="1.91:1">

  <meta property="fc:frame:button:1" content="Mint an Artwork (0.0003 ETH)">
  <meta property="fc:frame:button:1:action" content="tx">
  <meta property="fc:frame:button:1:target" content="/api/tx">

  <meta property="fc:frame:button:2" content="Open Mint Page">
  <meta property="fc:frame:button:2:action" content="link">
  <meta property="fc:frame:button:2:target" content="/mint.html">

  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: #0d0d12; color: #e8e8ec;
           font-family: system-ui, sans-serif; display: grid; place-items: center; padding: 20px; }
    main { text-align: center; max-width: 640px; }
    img { width: 100%; max-width: 380px; border-radius: 16px; image-rendering: pixelated; }
    h1 { margin: 16px 0 4px; }
    p { color: #9a9aa5; line-height: 1.6; max-width: 520px; margin: 8px auto; }
    a { color: #8b6bf0; }
  </style>
</head>
<body>
  <main>
    <img src="https://hammallama7-boop.github.io/project/magic-internet-artworks/artwork/magic-internet-artwork-0001.png" alt="Magic Internet Artwork #1">
    <h1>Magic Internet Artworks</h1>
    <p>98 procedural pixel artworks minted on <b>Base mainnet</b> at 0.0003 ETH each.
       Open this URL inside a Farcaster client to see the interactive <code>tx</code> frame.</p>
    <p>The frame lets you mint directly from the Farcaster wallet (no Rabby required).</p>
    <p><a href="/mint.html">Open the Base mint page (connect your wallet) →</a></p>
  </main>
</body>
</html>
